<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buy or Wait?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">HackerRank Orchestrate</p>
        <h1>Buy or Wait?</h1>
      </div>
      <div class="summary-strip" id="summaryStrip"></div>
    </header>

    <main class="app-shell">
      <aside class="request-rail">
        <div class="search-row">
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search requests" />
        </div>
        <div class="filters">
          <select id="statusFilter" aria-label="Filter by affordability status"></select>
          <select id="methodFilter" aria-label="Filter by payment method"></select>
        </div>
        <section class="upload-card">
          <p class="eyebrow">Ask your own CSV</p>
          <label class="file-button" for="csvUpload">Choose CSV</label>
          <input id="csvUpload" type="file" accept=".csv,text/csv" />
          <p id="sourceHint">Using the built-in Buy-or-Wait decisions.</p>
          <button id="clearUpload" type="button" hidden>Back to built-in data</button>
        </section>
        <div class="request-list" id="requestList"></div>
      </aside>

      <section class="chat-panel" aria-label="Buy or Wait chat">
        <div class="chat-head">
          <div>
            <p class="eyebrow" id="selectedMeta"></p>
            <h2 id="selectedTitle">Loading...</h2>
          </div>
          <button class="icon-button" id="detailsToggle" type="button" title="Toggle details" aria-label="Toggle details">
            <span>i</span>
          </button>
        </div>

        <div class="thread" id="chatThread" aria-live="polite"></div>

        <div class="prompt-chips" id="promptChips"></div>

        <form class="composer" id="chatForm">
          <input id="chatInput" autocomplete="off" placeholder="Message Buy or Wait" />
          <button type="submit" title="Send" aria-label="Send">Send</button>
        </form>
      </section>

      <aside class="context-panel" id="contextPanel">
        <section class="decision-card">
          <p class="eyebrow">Current request</p>
          <dl class="metric-grid" id="metricGrid"></dl>
        </section>

        <section class="panel curve-panel">
          <div class="panel-heading">
            <h3>Balance forecast</h3>
            <div class="legend">
              <span><i class="dot balance"></i>Balance</span>
              <span><i class="dot floor"></i>Floor</span>
              <span><i class="dot pay"></i>Payment</span>
            </div>
          </div>
          <div class="chart-wrap">
            <svg id="curveChart" viewBox="0 0 900 320" role="img" aria-label="Forecast balance chart"></svg>
          </div>
        </section>

        <section class="tabs" aria-label="Detail tabs">
          <button class="tab active" data-tab="decision">Decision</button>
          <button class="tab" data-tab="candidates">Plans</button>
          <button class="tab" data-tab="evidence">Evidence</button>
          <button class="tab" data-tab="quality">Quality</button>
        </section>

        <section class="tab-panel active" id="tab-decision">
          <div class="row-details" id="rowDetails"></div>
        </section>

        <section class="tab-panel" id="tab-candidates">
          <div class="table-wrap" id="candidateTable"></div>
          <div class="stack-list" id="rejectedList"></div>
        </section>

        <section class="tab-panel" id="tab-evidence">
          <div class="stack-list" id="messageList"></div>
          <div class="stack-list" id="imageList"></div>
        </section>

        <section class="tab-panel" id="tab-quality">
          <div class="table-wrap" id="drawdownTable"></div>
          <pre class="usage-report" id="usageReport"></pre>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
